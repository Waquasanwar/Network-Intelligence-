<title>Network Intelligence</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
  --canvas: #f3f4f8; --surface: #ffffff; --surface-2: #f6f7fb; --surface-hover: #f9fafc;
  --line: rgba(15, 23, 42, 0.08); --line-strong: rgba(15, 23, 42, 0.16);
  --ink: #0f172a; --ink-2: #5b6474; --ink-3: #8a92a3;
  --rail: #0b1226; --rail-2: #101a33; --rail-ink: rgba(255,255,255,0.72);
  --teal: #0d7a6f; --teal-b: #14b8a6; --teal-bg: rgba(20,184,166,0.12);
  --navy: #0f1e3d; --navy-b: #4f6fd6; --navy-bg: rgba(79,111,214,0.12);
  --amber: #b45309; --amber-b: #f59e0b; --amber-bg: rgba(245,158,11,0.14);
  --risk: #b42318; --risk-bg: rgba(220,38,38,0.12);
  --hero-a: #0b1226; --hero-b: #0e2a3f;
  --shadow: 0 1px 2px rgba(15,23,42,0.05), 0 16px 40px -24px rgba(15,23,42,0.35);
  --shadow-hover: 0 2px 4px rgba(15,23,42,0.06), 0 24px 48px -20px rgba(15,23,42,0.35);
  --shadow-pop: 0 30px 80px -20px rgba(15,23,42,0.45), 0 0 0 1px rgba(15,23,42,0.06);
  --btn-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 1px 2px rgba(15,30,61,0.3), 0 8px 20px -10px rgba(15,30,61,0.6);
  --primary-bg: linear-gradient(180deg, #1b2f5e, #0f1e3d); --primary-ink: #fff;
  --glass: rgba(255,255,255,0.7); --glass-line: rgba(255,255,255,0.7);
  --code-bg: rgba(15,23,42,0.06);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --canvas: #070b14; --surface: #0f1626; --surface-2: #141d30; --surface-hover: #172038;
  --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.16);
  --ink: #eef1f7; --ink-2: #a3acbf; --ink-3: #6f7a90;
  --rail: #05080f; --rail-2: #0a1020;
  --teal: #3fd2c0; --navy: #dfe6f8; --navy-b: #8ea6e6; --amber: #f5b04a; --risk: #f87171;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 40px -24px rgba(0,0,0,0.8);
  --shadow-hover: 0 2px 4px rgba(0,0,0,0.5), 0 24px 48px -20px rgba(0,0,0,0.9);
  --shadow-pop: 0 30px 80px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06);
  --btn-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 1px 2px rgba(0,0,0,0.5);
  --primary-bg: linear-gradient(180deg, #f4f6fb, #d9e0f2); --primary-ink: #0b1226;
  --glass: rgba(15,22,38,0.7); --glass-line: rgba(255,255,255,0.08);
  --code-bg: rgba(255,255,255,0.08);
} }
:root[data-theme="dark"] {
  --canvas: #070b14; --surface: #0f1626; --surface-2: #141d30; --surface-hover: #172038;
  --line: rgba(255,255,255,0.08); --line-strong: rgba(255,255,255,0.16);
  --ink: #eef1f7; --ink-2: #a3acbf; --ink-3: #6f7a90;
  --rail: #05080f; --rail-2: #0a1020;
  --teal: #3fd2c0; --navy: #dfe6f8; --navy-b: #8ea6e6; --amber: #f5b04a; --risk: #f87171;
  --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 16px 40px -24px rgba(0,0,0,0.8);
  --shadow-hover: 0 2px 4px rgba(0,0,0,0.5), 0 24px 48px -20px rgba(0,0,0,0.9);
  --shadow-pop: 0 30px 80px -20px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.06);
  --btn-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 1px 2px rgba(0,0,0,0.5);
  --primary-bg: linear-gradient(180deg, #f4f6fb, #d9e0f2); --primary-ink: #0b1226;
  --glass: rgba(15,22,38,0.7); --glass-line: rgba(255,255,255,0.08);
  --code-bg: rgba(255,255,255,0.08);
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14px/1.45 "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01", "ss03"; }
a { color: inherit; text-decoration: none; }
a:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.02em; }
p { margin: 0; }
code, .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 12px; }
code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; }
:focus-visible { outline: 2px solid var(--navy-b); outline-offset: 2px; border-radius: 6px; }
.tabular, .num, .stat b { font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-2); } .ok { color: var(--teal); } .bad, .amber { color: var(--amber); } .ok, .bad { font-style: normal; font-weight: 500; }
.nowrap { white-space: nowrap; } .wrap { white-space: normal; max-width: 34ch; } .right { text-align: right; } .pre { white-space: pre-wrap; }
.sub { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 12px 0 6px; font-weight: 600; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; }

#app { display: flex; min-height: 100%; position: relative; }
.ambient { position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(900px 500px at 15% -10%, rgba(79,111,214,0.10), transparent 60%), radial-gradient(800px 500px at 100% 10%, rgba(20,184,166,0.10), transparent 60%); }

/* rail */
#rail { width: 236px; flex: none; position: sticky; top: 0; height: 100vh; background: linear-gradient(180deg, var(--rail), var(--rail-2)); color: var(--rail-ink); display: flex; flex-direction: column; padding: 18px 12px 12px; z-index: 2; }
#rail .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
#rail .brand .mark { width: 32px; height: 32px; border-radius: 10px; background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06)); box-shadow: inset 0 1px 0 rgba(255,255,255,0.22), 0 0 0 1px rgba(255,255,255,0.1); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11.5px; letter-spacing: -0.02em; }
#rail .brand b { display: block; color: #fff; font-size: 13px; } #rail .brand small { display: block; color: rgba(255,255,255,0.45); font-size: 11px; }
#rail nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
#rail nav a { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--rail-ink); transition: background 120ms, color 120ms; }
#rail nav a i { font-style: normal; width: 16px; height: 16px; display: inline-flex; color: rgba(255,255,255,0.45); } #rail nav a i svg { width: 16px; height: 16px; }
#rail nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
#rail nav a.active { background: rgba(255,255,255,0.1); color: #fff; font-weight: 500; box-shadow: inset 0 1px 0 rgba(255,255,255,0.07); }
#rail nav a.active i { color: var(--teal-b); }
#rail nav a.active::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 16px; border-radius: 0 4px 4px 0; background: var(--teal-b); box-shadow: 0 0 12px rgba(20,184,166,0.8); }
#rail .group { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); padding: 16px 10px 6px; font-weight: 600; }
#rail .me { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
#rail .me b { display: block; color: #fff; font-size: 12.5px; } #rail .me small { color: rgba(255,255,255,0.45); font-size: 11px; }
#rail .me div { flex: 1; min-width: 0; }
.icon { background: none; border: 0; color: inherit; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }
.icon:hover { background: rgba(127,127,127,0.15); }

/* content */
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; z-index: 1; }
#top { position: sticky; top: 0; z-index: 20; height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 28px; background: color-mix(in srgb, var(--canvas) 70%, transparent); backdrop-filter: saturate(180%) blur(16px); -webkit-backdrop-filter: saturate(180%) blur(16px); border-bottom: 1px solid var(--line); }
#crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); min-width: 0; } #crumbs b { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #crumbs .sep { color: var(--ink-3); }
.searchbtn svg { width: 15px; height: 15px; flex: none; } .searchbtn { display: flex; align-items: center; gap: 8px; height: 36px; width: 320px; max-width: 40vw; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-3); font: inherit; font-size: 12.5px; padding: 0 12px 0 14px; cursor: text; box-shadow: 0 1px 2px rgba(15,23,42,0.04); transition: border-color 120ms; }
.searchbtn:hover { border-color: var(--line-strong); } .searchbtn kbd { margin-left: auto; }
kbd { font-family: "Geist Mono", monospace; font-size: 10.5px; border: 1px solid var(--line-strong); border-radius: 5px; padding: 2px 6px; color: var(--ink-2); background: var(--surface); }
main { padding: 28px 28px 80px; max-width: 1380px; width: 100%; margin: 0 auto; }
main > * { animation: rise 420ms cubic-bezier(0.2,0.8,0.2,1) backwards; }
main > *:nth-child(2) { animation-delay: 50ms; } main > *:nth-child(3) { animation-delay: 100ms; } main > *:nth-child(n+4) { animation-delay: 150ms; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(-6px) scale(0.985); } to { opacity: 1; transform: none; } }
@keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { main > *, .panel, .box, .scrim, .toast { animation: none !important; } .lift:hover { transform: none; } }

/* hero */
.hero { position: relative; border-radius: 22px; overflow: hidden; background: radial-gradient(1200px 500px at 20% 0%, #163a52 0%, var(--hero-a) 55%), var(--hero-a); color: #fff; min-height: 420px; box-shadow: var(--shadow-pop); margin-bottom: 24px; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(700px 300px at 85% 100%, rgba(20,184,166,0.18), transparent 60%); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-inner { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 480px) 1fr; gap: 28px; padding: 36px; min-height: 420px; align-content: space-between; pointer-events: none; }
.hero-inner > * { pointer-events: auto; }
.hero-text .eyebrow { color: rgba(255,255,255,0.55); }
.hero-text h1 { font-size: 34px; line-height: 1.08; letter-spacing: -0.035em; font-weight: 600; text-wrap: balance; }
.hero-text p { margin-top: 12px; color: rgba(255,255,255,0.7); max-width: 46ch; font-size: 14px; line-height: 1.55; }
.hero-actions { display: flex; gap: 10px; margin-top: 20px; }
.hero-stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-self: end; }
.hero .stat { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
.hero .stat small { color: rgba(255,255,255,0.6); } .hero .stat span { color: rgba(255,255,255,0.45); } .hero .stat:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.2); }
.hero .stat.teal b { color: #5eead4; } .hero .stat.amber b { color: #fcd34d; }

/* stats, cards */
.stat { display: block; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); padding: 14px 16px; box-shadow: var(--shadow); transition: transform 160ms cubic-bezier(0.2,0.8,0.2,1), box-shadow 160ms, border-color 160ms, background 160ms; }
a.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--line-strong); }
.stat small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { display: block; font-size: 26px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin-top: 4px; }
.stat span { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.teal b { color: var(--teal); } .stat.amber b { color: var(--amber); }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.card { border-radius: 18px; border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); min-width: 0; }
.card > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 20px 6px; }
.card > header h3 { font-size: 14.5px; font-weight: 600; } .card > header p { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }
.card > .body { padding: 10px 20px 20px; } .card > .body.flush { padding: 8px 0 0; }
.card.caution { border-color: rgba(245,158,11,0.4); }
.card.match { transition: transform 160ms, box-shadow 160ms; } .card.match.rec { border-color: rgba(20,184,166,0.45); box-shadow: var(--shadow), 0 0 0 3px rgba(20,184,166,0.08); } .card.match.dimmed { opacity: 0.55; }
.table-card { overflow: hidden; }
.grid-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; align-items: start; } .col-2 { min-width: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .grid-3f { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-side { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
.grid-import { display: grid; grid-template-columns: 380px 1fr; gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .row.end { justify-content: flex-end; } .row.wrap { flex-wrap: wrap; }
.rows { list-style: none; margin: 0; padding: 0; } .rows li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); } .rows li:last-child { border-bottom: 0; } .rows li.col { flex-direction: column; align-items: stretch; gap: 6px; }
.rows .when { font-size: 12px; color: var(--ink-2); white-space: nowrap; }
.action { display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; width: 100%; } .action i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--teal-b); margin-top: 7px; box-shadow: 0 0 10px rgba(20,184,166,0.7); }
.action:hover { color: var(--teal); }
.olink b, .t { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .olink small, small.t { display: block; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .olink { min-width: 0; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; } .trio b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -0.03em; } .trio small { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); }
.log { list-style: none; margin: 0; padding: 0; } .log li { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-2); padding: 5px 0; } .log li small { color: var(--ink-3); white-space: nowrap; }
.mini { font-size: 12px; color: var(--teal); font-weight: 500; white-space: nowrap; } .mini:hover { text-decoration: underline; }
.empty { border: 1px dashed var(--line-strong); border-radius: 14px; padding: 28px 20px; text-align: center; color: var(--ink-2); } .empty b { display: block; color: var(--ink); font-size: 13.5px; } .empty p { font-size: 12.5px; margin-top: 4px; } .empty .btn { margin-top: 12px; } .empty.tall { padding: 80px 20px; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
.page-head h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.03em; } .page-head p { color: var(--ink-2); margin-top: 4px; max-width: 70ch; } .page-head .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions { display: flex; gap: 8px; align-items: center; flex: none; flex-wrap: wrap; justify-content: flex-end; }
.sect-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 8px 0 4px; } .sect-head h2 { font-size: 15px; font-weight: 600; } .sect-head p { font-size: 12.5px; color: var(--ink-2); max-width: 70ch; }

/* atoms */
.avatar { display: inline-grid; place-items: center; border-radius: 50%; color: #fff; font-weight: 600; letter-spacing: -0.02em; flex: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.25); }
.avatar.sm { width: 26px; height: 26px; font-size: 10px; } .avatar.md { width: 32px; height: 32px; font-size: 12px; } .avatar.xl { width: 68px; height: 68px; font-size: 22px; }
.avatar.hue-0 { background: linear-gradient(135deg, #1b2f5e, #4f6fd6); } .avatar.hue-1 { background: linear-gradient(135deg, #0d7a6f, #14b8a6); } .avatar.hue-2 { background: linear-gradient(135deg, #334155, #64748b); } .avatar.hue-3 { background: linear-gradient(135deg, #3b5ba9, #14b8a6); }
.avatar.ring { outline: 2px solid transparent; box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px transparent; background-clip: padding-box; position: relative; }
.avatar.ring::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; background: conic-gradient(from 210deg, #4f6fd6, #14b8a6, #4f6fd6); z-index: -1; -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); mask: radial-gradient(farthest-side, transparent calc(100% - 2.5px), #000 calc(100% - 2px)); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; } .badge i { width: 6px; height: 6px; border-radius: 50%; }
.badge.tone-teal { color: var(--teal); } .badge.tone-teal i { background: var(--teal-b); box-shadow: 0 0 8px rgba(20,184,166,0.6); }
.badge.tone-amber { color: var(--amber); } .badge.tone-amber i { background: var(--amber-b); box-shadow: 0 0 8px rgba(245,158,11,0.5); }
.badge.tone-navy { color: var(--navy); } .badge.tone-navy i { background: var(--navy-b); }
.badge.tone-neutral { color: var(--ink-2); } .badge.tone-neutral i { background: var(--ink-3); }
.badge.tone-risk { color: var(--risk); } .badge.tone-risk i { background: var(--risk); }
.badge.filled { padding: 2px 9px; border-radius: 999px; font-size: 11px; } .badge.filled i { display: none; }
.badge.filled.tone-teal { background: var(--teal-bg); } .badge.filled.tone-amber { background: var(--amber-bg); } .badge.filled.tone-navy { background: var(--navy-bg); } .badge.filled.tone-neutral { background: var(--code-bg); }
.stale { font-size: 10.5px; color: var(--amber); margin-left: 6px; } .aging { font-size: 10.5px; color: var(--ink-3); margin-left: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; } .chips small { font-size: 11px; color: var(--ink-3); }
.chip { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; color: var(--ink-2); background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
.chip.teal { color: var(--teal); background: var(--teal-bg); border-color: transparent; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 16px; }
.pill { display: inline-flex; align-items: center; height: 30px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--ink-2); transition: all 120ms; }
.pill:hover { border-color: var(--line-strong); color: var(--ink); } .pill.active { background: var(--primary-bg); color: var(--primary-ink); border-color: transparent; box-shadow: var(--btn-shadow); }
.clear { font-size: 12px; color: var(--ink-3); margin-left: 6px; } .clear:hover { color: var(--ink); }
