/* inside a view, the primary action and the soft washes take that view's light */
[data-view] .btn.primary { background: linear-gradient(180deg, var(--accent-b), var(--accent)); color: var(--accent-ink); box-shadow: 0 8px 20px -10px var(--glow), inset 0 1px 0 rgba(255,255,255,0.22); }
[data-view] .btn.primary:hover { filter: brightness(1.06) saturate(1.05); }
.card.accent { background: var(--wash-soft), var(--surface); border-color: color-mix(in srgb, var(--accent-b) 26%, var(--line)); }
.card.accent > header h3 { color: var(--accent); }
.accent-rule { height: 3px; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-b), transparent); margin: 0 0 18px; }
.accent-text { color: var(--accent); }
.wash-tile { border-radius: 16px; padding: 14px 16px; background: var(--wash-soft), var(--surface); border: 1px solid color-mix(in srgb, var(--accent-b) 22%, var(--line)); }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--canvas); color: var(--ink); font: 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; font-feature-settings: "ss01", "ss02"; }
a { color: inherit; text-decoration: none; }
a:hover b { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
h1, h2, h3 { margin: 0; letter-spacing: -0.025em; font-weight: 550; }
p { margin: 0; }
code, .mono { font-family: "Geist Mono", ui-monospace, Menlo, monospace; font-size: 12px; }
code { background: var(--code-bg); padding: 1px 6px; border-radius: 5px; }
:focus-visible { outline: 2px solid var(--navy-b); outline-offset: 2px; border-radius: 6px; }
.tabular, .num, .stat b { font-variant-numeric: tabular-nums; }
.dim { color: var(--ink-2); } .ok { color: var(--teal); } .bad, .amber { color: var(--amber); } .ok, .bad { font-style: normal; font-weight: 500; }
.block { display: block; }
.nowrap { white-space: nowrap; } .wrap { white-space: normal; max-width: 34ch; } .right { text-align: right; } .pre { white-space: pre-wrap; }
.sub { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; }
.lbl { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-3); margin: 12px 0 6px; font-weight: 600; }
.eyebrow { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-3); font-weight: 600; margin-bottom: 8px; }

#app { display: flex; min-height: 100%; position: relative; }
.ambient { display: none; }
:root { --glass-card: var(--surface); --glass-card-line: var(--line); }

/* rail */
#rail { width: 244px; flex: none; position: sticky; top: 0; height: 100vh; background: var(--rail); color: var(--rail-ink); display: flex; flex-direction: column; padding: 20px 12px 12px; z-index: 2; border-right: 1px solid rgba(255,255,255,0.06); }
#rail .brand { display: flex; align-items: center; gap: 10px; padding: 0 6px 18px; }
#rail .brand .mark { width: 30px; height: 30px; border-radius: 9px; background: rgba(255,255,255,0.1); box-shadow: 0 0 0 1px rgba(255,255,255,0.08); display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 11.5px; letter-spacing: -0.02em; }
#rail .brand b { display: block; color: #fff; font-size: 13px; } #rail .brand small { display: block; color: rgba(255,255,255,0.45); font-size: 11px; }
#rail nav { flex: 1; display: flex; flex-direction: column; gap: 2px; }
#rail nav a { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; font-size: 13px; color: var(--rail-ink); transition: background 120ms, color 120ms; }
#rail nav a i { font-style: normal; width: 16px; height: 16px; display: inline-flex; color: rgba(255,255,255,0.45); } #rail nav a i svg { width: 16px; height: 16px; }
#rail nav a:hover { background: rgba(255,255,255,0.06); color: #fff; }
#rail nav a.active { background: rgba(255,255,255,0.09); color: #fff; font-weight: 500; }
#rail nav a.active i { color: #fff; }
#rail nav a.active::before { content: none; }
#rail .group { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); padding: 16px 10px 6px; font-weight: 600; }
#rail .me { display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); box-shadow: 0 0 0 1px rgba(255,255,255,0.08); }
#rail .me b { display: block; color: #fff; font-size: 12.5px; } #rail .me small { color: rgba(255,255,255,0.45); font-size: 11px; }
#rail .me div { flex: 1; min-width: 0; }
.icon { background: none; border: 0; color: inherit; cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-size: 15px; }
.icon:hover { background: rgba(127,127,127,0.15); }

/* content */
.content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; z-index: 1; }
#top { position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 40px; background: color-mix(in srgb, var(--canvas) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
#crumbs { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-2); min-width: 0; } #crumbs b { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #crumbs .sep { color: var(--ink-3); }
.searchbtn svg { width: 15px; height: 15px; flex: none; } .searchbtn { display: flex; align-items: center; gap: 8px; height: 36px; width: 320px; max-width: 40vw; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-3); font: inherit; font-size: 12.5px; padding: 0 12px 0 14px; cursor: text; box-shadow: 0 1px 2px rgba(15,23,42,0.04); transition: border-color 120ms; }
.searchbtn:hover { border-color: var(--line-strong); } .searchbtn kbd { margin-left: auto; }
kbd { font-family: "Geist Mono", monospace; font-size: 10.5px; border: 1px solid var(--line-strong); border-radius: 5px; padding: 2px 6px; color: var(--ink-2); background: var(--surface); }
main { padding: 36px 40px 120px; max-width: 1320px; width: 100%; margin: 0 auto; }
main > * { animation: rise 460ms var(--out) backwards; }
main > *:nth-child(2) { animation-delay: 45ms; } main > *:nth-child(3) { animation-delay: 90ms; } main > *:nth-child(4) { animation-delay: 130ms; } main > *:nth-child(n+5) { animation-delay: 165ms; }
@keyframes rise { from { opacity: 0; transform: translateY(12px) scale(0.995); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(0.96); } to { opacity: 1; transform: none; } }
@keyframes slide { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { main > *, .panel, .box, .scrim, .toast, .menu-panel, .content.step-in, .content.step-out { animation: none !important; } .lift:hover, .btn:active, .newbtn:active { transform: none; } }

/* hero */
.hero { position: relative; border-radius: 18px; overflow: hidden; background: var(--hero-a); color: #fff; min-height: 400px; box-shadow: var(--shadow); margin-bottom: 28px; }
.hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(620px 320px at 82% 92%, rgba(16,166,147,0.13), transparent 62%); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-inner { position: relative; z-index: 1; display: grid; grid-template-columns: minmax(0, 480px) 1fr; gap: 28px; padding: 36px; min-height: 420px; align-content: space-between; pointer-events: none; }
.hero-inner > * { pointer-events: auto; }
.hero-text .eyebrow { color: rgba(255,255,255,0.55); }
.hero-text h1 { font-size: 36px; line-height: 1.06; letter-spacing: -0.04em; font-weight: 550; text-wrap: balance; }
.hero-text p { margin-top: 12px; color: rgba(255,255,255,0.7); max-width: 46ch; font-size: 14px; line-height: 1.55; }
.hero-actions { display: flex; gap: 10px; margin-top: 20px; }
.hero-stats { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; align-self: end; }
.hero .stat { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09); color: #fff; box-shadow: none; }
.hero .stat small { color: rgba(255,255,255,0.6); } .hero .stat span { color: rgba(255,255,255,0.45); } .hero .stat:hover { background: rgba(255,255,255,0.11); border-color: rgba(255,255,255,0.2); }
.hero .stat.teal b { color: #5eead4; } .hero .stat.amber b { color: #fcd34d; }

/* stats, cards */
.stat { display: block; border-radius: var(--r-card); border: 1px solid var(--line); background: var(--surface); padding: 15px 17px; box-shadow: var(--shadow); transition: transform 160ms cubic-bezier(0.2,0.8,0.2,1), box-shadow 160ms, border-color 160ms, background 160ms; }
a.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); border-color: var(--line-strong); }
.stat small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 450; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { display: block; font-size: 27px; font-weight: 550; letter-spacing: -0.035em; line-height: 1.12; margin-top: 6px; }
.stat span { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat.teal b { color: var(--teal); } .stat.amber b { color: var(--amber); }
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 24px; }
.card { border-radius: var(--r-card); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); min-width: 0; }

.card > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px 4px; }
.card > header h3 { font-size: 14px; font-weight: 550; letter-spacing: -0.01em; } .card > header p { font-size: 12.5px; color: var(--ink-2); margin-top: 4px; line-height: 1.5; max-width: 62ch; }
.card > .body { padding: 12px 22px 22px; } .card > .body.flush { padding: 6px 0 0; }
.card.caution { border-color: rgba(245,158,11,0.4); }
.card.match > .body > .row:first-child { align-items: flex-start; flex-wrap: wrap; }
.card.match > .body > .row:first-child .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; justify-content: flex-end; }
.card.match { transition: border-color 160ms; } .card.match.rec { border-color: rgba(16,166,147,0.38); } .card.match.dimmed { opacity: 0.55; }
.table-card { overflow: hidden; }
.grid-3 { display: grid; grid-template-columns: minmax(0, 1.9fr) minmax(300px, 1fr); gap: 20px; align-items: start; } .col-2 { min-width: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; } .grid-3f { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.grid-side { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
.grid-import { display: grid; grid-template-columns: 380px 1fr; gap: 16px; align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; } .row.end { justify-content: flex-end; } .row.wrap { flex-wrap: wrap; }
.rows { list-style: none; margin: 0; padding: 0; } .rows li { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); } .rows li:last-child { border-bottom: 0; } .rows li.col { flex-direction: column; align-items: stretch; gap: 6px; }
.rows .when { font-size: 12px; color: var(--ink-2); white-space: nowrap; }

#drawer, #palette { position: fixed; inset: 0; z-index: 50; }
.scrim { position: absolute; inset: 0; background: rgba(6, 10, 20, 0.45); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); animation: fade 160ms ease-out; }
.panel { position: absolute; right: 12px; top: 12px; bottom: 12px; width: 520px; max-width: calc(100vw - 24px); background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-pop); display: flex; flex-direction: column; overflow: hidden; animation: slide 320ms var(--out); } .panel.wide { width: 780px; }
.panel > header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 22px 14px; border-bottom: 1px solid var(--line); } .panel h2 { font-size: 16px; font-weight: 600; } .panel header p { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; max-width: 56ch; }
.panel .content { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; } .panel footer { display: flex; justify-content: flex-end; gap: 8px; padding-top: 10px; margin-top: auto; }
#palette .box { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); width: 600px; max-width: 92vw; background: var(--surface); border-radius: 22px; box-shadow: var(--shadow-pop); overflow: hidden; animation: pop 220ms var(--spring); }
#palette .in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--line); } #palette .in svg { color: var(--ink-3); flex: none; } #palette input { border: 0; box-shadow: none; height: 50px; padding: 0; font-size: 14px; background: transparent; } #palette input:focus { box-shadow: none; }
#palette ul { list-style: none; margin: 0; padding: 6px; max-height: 380px; overflow-y: auto; } #palette li a { display: flex; justify-content: space-between; gap: 10px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px; } #palette li a.active, #palette li a:hover { background: var(--navy-bg); } #palette li small { color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } #palette li.none { padding: 24px; text-align: center; color: var(--ink-3); font-size: 12.5px; }
#toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; pointer-events: none; }
.toast { background: var(--rail); color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px; box-shadow: var(--shadow-pop); animation: toast-in 380ms var(--spring); display: flex; align-items: center; gap: 8px; }
@keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(0.94); } to { opacity: 1; transform: none; } } .toast::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--teal-b); box-shadow: 0 0 10px rgba(20,184,166,0.8); } .toast.tone-amber::before { background: var(--amber-b); } .toast.tone-risk::before { background: #f87171; } .toast.tone-neutral::before { background: rgba(255,255,255,0.5); box-shadow: none; } .toast.out { opacity: 0; transition: opacity 400ms; }

/* demand: co-pilot, requirements, portal */
.copilot { margin-bottom: 20px; background: linear-gradient(180deg, var(--surface), var(--surface-2)); border-color: rgba(79,111,214,0.25); box-shadow: var(--shadow), 0 0 0 4px rgba(79,111,214,0.06); }
.copilot-in { position: relative; display: flex; gap: 10px; align-items: stretch; } .copilot-in .spark { position: absolute; left: 14px; top: 12px; color: var(--navy-b); font-size: 15px; pointer-events: none; }
.copilot-in textarea { flex: 1; padding-left: 36px; font-size: 14.5px; line-height: 1.5; resize: vertical; min-height: 64px; border-radius: 16px; }
.copilot-in .btn { align-self: flex-end; height: 42px; white-space: nowrap; }
.examples { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; } .examples small { color: var(--ink-3); font-size: 11.5px; margin-right: 4px; } .examples .pill { height: 26px; font-size: 11.5px; padding: 0 10px; cursor: pointer; }
.copilot-result { scroll-margin-top: 84px; margin-top: 18px; padding-top: 18px; border-top: 1px solid var(--line); animation: pop 240ms cubic-bezier(0.2,0.8,0.2,1) backwards; }
.how-read { border-radius: 16px; background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; } .how-read .lbl { margin-top: 0; }
.chips.read .chip { background: var(--navy-bg); color: var(--navy); border-color: transparent; font-weight: 500; max-width: none; }
.assume { margin: 10px 0 0; padding-left: 18px; font-size: 12.5px; color: var(--ink-2); display: grid; gap: 3px; }
.tier-group { margin-top: 14px; } .tier-head { display: flex; align-items: center; gap: 8px; margin: 0 0 8px 4px; } .tier-head small { color: var(--ink-3); font-size: 11.5px; }
.card.match.compact { margin-bottom: 10px; } .card.match.compact .body { padding: 12px 16px 14px; } .card.match.compact p { margin-top: 6px; font-size: 12.5px; }
.fit { display: inline-flex; align-items: center; min-width: 110px; } .fit .score { width: 100%; }
.checks-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 14px; }
.checks-list li { position: relative; display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; color: var(--ink-2); cursor: help; }
.checks-list li i { width: 17px; height: 17px; border-radius: 50%; display: inline-grid; place-items: center; font-style: normal; color: currentColor; }
.checks-list li.met { color: var(--teal); } .checks-list li.met i { background: var(--teal-bg); } 
.checks-list li.unmet { color: var(--risk); } .checks-list li.unmet i { background: var(--risk-bg); } 
.checks-list li.unknown { color: var(--amber); } .checks-list li.unknown i { background: var(--amber-bg); } 
.checks-list li small { display: none; position: absolute; left: 0; top: 22px; z-index: 5; width: 260px; background: var(--rail); color: #fff; padding: 8px 10px; border-radius: 10px; font-size: 11.5px; font-weight: 400; line-height: 1.4; box-shadow: var(--shadow-pop); }
.checks-list li:hover small { display: block; }
.save-brief h3 { font-size: 15px; font-weight: 600; } .save-brief .body { padding: 18px 20px 20px; }
.fee-box { border-radius: 16px; padding: 14px 16px; background: linear-gradient(135deg, rgba(20,184,166,0.14), rgba(79,111,214,0.10)); border: 1px solid rgba(20,184,166,0.3); }
.fee-box small { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 600; }
.fee-box b { display: block; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; line-height: 1.15; margin: 4px 0 2px; color: var(--teal); } .fee-box span { display: block; font-size: 12px; color: var(--ink-2); }
.fee-box.unsure { background: var(--surface-2); border-color: var(--line); } .fee-box.unsure b { color: var(--ink-3); }
.terms .field { margin: 0; }
.quote { margin: 0 0 12px; padding: 12px 16px; border-left: 3px solid var(--navy-b); background: var(--surface-2); border-radius: 0 12px 12px 0; font-size: 14px; line-height: 1.55; font-style: italic; color: var(--ink); }
.anon-list li.anon { flex-direction: column; align-items: stretch; gap: 6px; } .anon-list li.anon code { font-size: 11px; } .anon-list li.anon > .row > .row { gap: 8px; }
.anon-list li.portal-actions { justify-content: flex-start; gap: 8px; padding-top: 0; border-bottom: 1px solid var(--line); }
.pitch-quote { margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); } .pitch-quote p { font-size: 13px; font-style: italic; line-height: 1.5; margin: 4px 0 6px; } .pitch-quote .chips { margin-top: 6px; }
.terms-line { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); font-size: 12.5px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } .terms-line b { font-weight: 600; }
.portal-hero { position: relative; overflow: hidden; border-radius: 26px; padding: 32px 34px; margin-bottom: 22px; color: #fff; background: var(--wash); box-shadow: 0 20px 44px -28px var(--glow), var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: end; }
.portal-hero::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(620px 300px at 88% -10%, rgba(255,255,255,0.22), transparent 62%); }
.portal-hero > * { position: relative; z-index: 1; }
.portal-hero .eyebrow { color: rgba(255,255,255,0.55); } .portal-hero h1 { font-size: 30px; letter-spacing: -0.03em; font-weight: 600; margin-top: 8px; } .portal-hero p { color: rgba(255,255,255,0.7); max-width: 60ch; margin-top: 8px; font-size: 13.5px; }
.portal-hero select.lg { height: 36px; border-radius: 999px; background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); max-width: 340px; } .portal-hero select.lg option { color: var(--ink); }
.portal-hero .hero-stats { grid-column: auto; display: flex; gap: 10px; } .portal-hero .stat { min-width: 132px; background: rgba(8,10,9,0.3); border-color: rgba(255,255,255,0.22); color: #fff; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: none; } .portal-hero .stat small { color: rgba(255,255,255,0.78); } .portal-hero .stat span { color: rgba(255,255,255,0.62); } .portal-hero .stat b { font-family: var(--mono); font-weight: 500; }
.req-table { table-layout: fixed; width: 100%; } .req-table th:first-child { width: 44%; } .req-table th:last-child { width: 20%; } .req-table td { vertical-align: top; } .req-table td .sub { white-space: normal; } .req-table .sub .badge { margin-right: 2px; }
.steps-list { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 12.5px; color: var(--ink-2); } .steps-list b { color: var(--ink); font-weight: 600; }
/* the New menu: one way in to every flow */
.newbtn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 15px 0 12px; border-radius: 999px; border: 1px solid transparent; background: var(--primary-bg); color: var(--primary-ink); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: var(--btn-shadow); transition: transform 120ms var(--spring), filter 140ms; }
.newbtn svg { width: 15px; height: 15px; }
.newbtn:hover { filter: brightness(1.1); } .newbtn:active { transform: scale(0.96); }
#newmenu { position: fixed; top: 60px; right: 96px; z-index: 40; }
.menu-panel { width: 300px; padding: 6px; border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-pop); animation: pop 220ms var(--spring); transform-origin: top right; }
.menu-panel button { display: flex; width: 100%; align-items: center; gap: 11px; padding: 10px 11px; border: 0; border-radius: 13px; background: transparent; font: inherit; text-align: left; cursor: pointer; color: var(--ink); transition: background 120ms; }
.menu-panel button:hover { background: var(--surface-2); }
.menu-panel b { display: block; font-size: 13px; font-weight: 550; } .menu-panel small { display: block; font-size: 11.5px; color: var(--ink-3); margin-top: 1px; }

/* a flow that happens in one panel: steps slide, they do not reload */
.step-dots { display: flex; gap: 5px; margin-top: 10px; }
.step-dots i { width: 22px; height: 3px; border-radius: 999px; background: var(--line-strong); transition: background 220ms var(--out); }
.step-dots i.done { background: var(--accent-b); } .step-dots i.now { background: var(--accent); }
.panel .content.step-in { animation: step-in 300ms var(--out); }
.panel .content.step-out { position: absolute; inset: 64px 0 0; pointer-events: none; animation: step-out 180ms var(--inout) forwards; }
@keyframes step-in { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
@keyframes step-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateX(-18px); } }

/* getting started: the thread through setup */
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.checklist li { display: flex; align-items: center; gap: 11px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
.checklist li:last-child { border-bottom: 0; }
.checklist .tick { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; flex: none; color: transparent; transition: background 260ms var(--spring), border-color 260ms, color 200ms; }
.checklist li.done .tick { background: var(--accent); border-color: var(--accent); color: #fff; }
.checklist li.done b { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1px; }
.checklist b { display: block; font-size: 13px; font-weight: 550; } .checklist small { display: block; font-size: 11.5px; color: var(--ink-3); }
.checklist li > span { flex: 1; min-width: 0; }
.setup-bar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; margin: 2px 0 14px; }
.setup-bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-b)); transition: width 520ms var(--out); }

/* the conversation: what was said, on both sides */
.transcript { margin-bottom: 14px; }
.transcript ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.transcript li { font-size: 12.5px; line-height: 1.45; }
.transcript li span { display: inline-block; padding: 7px 11px; border-radius: 14px; max-width: 100%; }
.transcript li.interviewer span { background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.transcript li.person { text-align: right; }
.transcript li.person span { background: var(--wash-soft), var(--surface); border: 1px solid color-mix(in srgb, var(--accent-b) 26%, var(--line)); border-bottom-right-radius: 4px; text-align: left; }
.lobby-voice { margin: 20px 0 6px; text-align: left; }
.lobby-voice .lbl { color: rgba(255,255,255,0.45); margin: 0 0 8px; }
.lobby-voice .choice { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.lobby-voice .choice label { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 999px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); font-size: 12.5px; color: rgba(255,255,255,0.8); cursor: pointer; transition: background 120ms, border-color 120ms; }
.lobby-voice .choice label:hover { background: rgba(255,255,255,0.11); }
.lobby-voice .choice label.on { background: var(--accent-bg); border-color: var(--accent-b); color: #fff; }
.lobby-voice .choice input { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; margin: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,0.5); background: transparent; flex: none; box-shadow: none; padding: 0; }
.lobby-voice .choice label.on input { background: var(--accent-b); border-color: var(--accent-b); box-shadow: inset 0 0 0 2px rgba(0,0,0,0.35); }
.lobby-voice .choice label span { white-space: nowrap; }
.call-body.offer { grid-template-columns: 1fr; }
.offer-actions { justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 22px; }

/* the agency's commercial split, and the client's pipeline */
.split { display: grid; grid-template-columns: 1fr 18px 1fr 18px 1fr; gap: 12px 8px; align-items: start; margin-bottom: 12px; }
.split small { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; white-space: nowrap; }
.split b { display: block; font-family: var(--mono); font-size: 25px; font-weight: 500; letter-spacing: -0.02em; margin: 3px 0 2px; }
.split span { display: block; font-size: 11.5px; color: var(--ink-2); line-height: 1.35; }
.split .arrow { color: var(--ink-3); display: grid; place-items: center; padding-top: 22px; }
.wash-tile b.big { display: block; font-family: var(--mono); font-size: 34px; font-weight: 500; letter-spacing: -0.03em; color: var(--accent); line-height: 1.1; }
.rows.tight li { padding: 7px 0; font-size: 12.5px; } .rows.tight li small { text-align: right; max-width: 60%; }
.pipe { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-radius: 14px; overflow: hidden; }
.pipe > div { background: var(--surface-2); padding: 12px 12px 14px; }
.pipe > div.on { background: var(--wash-soft), var(--surface); }
.pipe b { display: block; font-family: var(--mono); font-size: 22px; font-weight: 500; letter-spacing: -0.02em; }
.pipe > div.on b { color: var(--accent); }
.pipe small { display: block; font-size: 11.5px; font-weight: 600; margin-top: 2px; }
.pipe span { display: block; font-size: 10.5px; color: var(--ink-3); margin-top: 2px; line-height: 1.3; text-wrap: balance; }
.portal-hero .switcher { margin-bottom: 10px; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } .split .arrow { transform: rotate(90deg); } .pipe { grid-template-columns: 1fr 1fr; } }
@media (max-width: 900px) { .portal-hero { grid-template-columns: 1fr; } .copilot-in { flex-direction: column; } .copilot-in .btn { align-self: stretch; } }

/* shell additions: sign-in switcher, alerts */
.top-actions { display: flex; align-items: center; gap: 8px; }
.bell { position: relative; width: 36px; height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; } .bell:hover { border-color: var(--line-strong); color: var(--ink); } .bell svg { width: 16px; height: 16px; }
.bell i { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px; background: var(--amber-b); color: #1a1200; font: 600 10.5px/18px var(--sans); font-style: normal; box-shadow: 0 0 0 2px var(--canvas); }
#alerts { position: fixed; top: 64px; right: 28px; z-index: 30; width: 380px; max-width: calc(100vw - 32px); animation: pop 200ms cubic-bezier(0.2,0.8,0.2,1); }
.alerts-panel { border-radius: 18px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-pop); overflow: hidden; } .alerts-panel header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-size: 13px; } .alerts-panel header small { color: var(--ink-3); }
.alerts-panel ul { list-style: none; margin: 0; padding: 6px; max-height: 60vh; overflow: auto; } .alerts-panel li a { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 12px; font-size: 12.5px; } .alerts-panel li a:hover { background: var(--surface-2); } .alerts-panel li a small { color: var(--ink-3); white-space: nowrap; } .alerts-panel p { padding: 14px 16px; font-size: 12.5px; }
#rail .signin { display: block; margin-top: 8px; padding: 8px 10px 10px; border-radius: 12px; background: rgba(255,255,255,0.04); } #rail .signin span { display: block; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.4); font-weight: 600; margin-bottom: 6px; }
#rail .signin select { width: 100%; height: 32px; border-radius: 9px; background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.14); font-size: 12px; padding: 0 8px; } #rail .signin select option, #rail .signin select optgroup { color: var(--ink); background: var(--surface); }

/* trust, fit */
.ring > div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1; } .ring b { font-size: calc(var(--size, 64px) * 0.3); font-weight: 600; letter-spacing: -0.03em; } .ring small { display: block; font-size: 9.5px; color: var(--ink-3); margin-top: 2px; }
.trust-head { display: flex; gap: 18px; align-items: flex-start; } .trust-head .band { display: block; font-size: 15px; font-weight: 600; margin-bottom: 4px; } .trust-head p { font-size: 12.5px; margin-bottom: 8px; }
.trust-bars { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; } .trust-bars li { display: grid; grid-template-columns: 130px 1fr 34px; gap: 8px 10px; align-items: center; font-size: 12px; } .trust-bars li span { color: var(--ink-2); } .trust-bars .bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--line); } .trust-bars .fill { height: 100%; background: linear-gradient(90deg, var(--teal), var(--teal-b)); border-radius: 999px; } .trust-bars .fill.neg { background: var(--amber-b); } .trust-bars b { text-align: right; font-variant-numeric: tabular-nums; } .trust-bars small { grid-column: 1 / -1; color: var(--ink-3); font-size: 11px; margin-top: -4px; }
.trust-mini { display: inline-flex; align-items: center; gap: 6px; } .trust-mini svg { width: 26px; height: 26px; transform: rotate(-90deg); } .trust-mini .track { fill: none; stroke: var(--line-strong); stroke-width: 5; } .trust-mini .val { fill: none; stroke-width: 5; stroke-linecap: round; } .trust-mini .val.hi { stroke: var(--teal-b); } .trust-mini .val.mid { stroke: var(--navy-b); } .trust-mini .val.lo { stroke: var(--amber-b); } .trust-mini b { font-size: 13px; font-variant-numeric: tabular-nums; } .trust-mini small { color: var(--ink-3); font-size: 11px; white-space: nowrap; }
.fit-rows { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; } .fit-rows li { display: grid; grid-template-columns: 170px 1fr 74px; gap: 12px; align-items: center; font-size: 12.5px; } .fit-rows li.wanted { background: var(--navy-bg); border-radius: 12px; padding: 6px 8px; margin: 0 -8px; }
.fit-rows .lbl-row { display: flex; flex-direction: column; gap: 3px; align-items: flex-start; } .fit-rows .lbl-row b { font-weight: 500; }
.fit-scale { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; } .fit-scale small { font-size: 10.5px; color: var(--ink-3); white-space: nowrap; max-width: 92px; overflow: hidden; text-overflow: ellipsis; }
